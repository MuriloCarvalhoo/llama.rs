[package]
name = "llama-vulkan"
version = "0.1.0"
edition = "2024"

[dependencies]
ash = "0.38"
half = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
llama-model = { workspace = true, features = ["gpu"] }
tracing = { version = "0.1.44", optional = true }
gguf = { version = "0.1.0", path = "../gguf" }

[dev-dependencies]
memmap2 = "0.9"
gguf = { workspace = true }
llama-tokenizer = { workspace = true }
llama-sampling = { workspace = true }
rand = { workspace = true }
ggml-cpu = { path = "../ggml-cpu" }
half.workspace = true

[build-dependencies]
shaderc = "0.10"

[lints.rust]
unsafe_code = "allow"

[features]
# Instrumentacao da timeline (ver llama-cli --trace).
profiling = ["dep:tracing"]
