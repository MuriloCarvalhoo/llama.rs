[package]
name = "llama-server"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "llama-server"
path = "src/main.rs"

[dependencies]
thiserror.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
gguf.workspace = true
llama-tokenizer.workspace = true
llama-chat.workspace = true
# feature `gpu` do llama-model é só o trait do backend residente — não puxa Vulkan.
llama-model = { path = "../llama-model", features = ["gpu"] }
llama-sampling.workspace = true
rand.workspace = true
memmap2 = "0.9"
llama-vulkan = { path = "../llama-vulkan", optional = true }

[features]
gpu = ["llama-vulkan"]

[lints]
workspace = true
